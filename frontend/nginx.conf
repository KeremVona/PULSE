# ==============================================================================
# PULSE Clinical Decision Support System (CDSS)
# Module: frontend.nginx.conf (High-Performance Production Reverse Proxy)
# Architecture: Static Single-Page Application (SPA) Delivery & API Proxy
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Root
    root /usr/share/nginx/html;
    index index.html;

    # Single-Page Application (SPA) Route Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy Outbound API Invocations to Backend API
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Direct Healthcheck Proxy
    location = /health {
        proxy_pass http://backend:5000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
